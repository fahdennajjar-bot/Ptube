name: HMPSP PPSSPP Headless

on:
  push:
    branches:
      - hotline-miami-psp-workbench
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq build-essential cmake ninja-build libgl1-mesa-dev libegl1-mesa-dev
      - name: Clone PPSSPP
        run: |
          git clone --recursive --depth 1 --branch v1.20.4 https://github.com/hrydgard/ppsspp.git ppsspp
      - name: Build headless
        run: |
          cmake -S ppsspp -B ppsspp/build -G Ninja -DHEADLESS=ON -DHEADLESS_CROSS=ON -DCMAKE_BUILD_TYPE=Release
          cmake --build ppsspp/build --target PPSSPPHeadless -j2
      - name: Package
        run: |
          mkdir -p out
          cp ppsspp/build/PPSSPPHeadless out/
          cp -r ppsspp/assets out/assets
          tar -czf PPSSPPHeadless-linux.tar.gz -C out .
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: PPSSPPHeadless-linux
          path: PPSSPPHeadless-linux.tar.gz
          retention-days: 2
